project: learn_dynamic_cool
group: test
expname: test
core:
  version: 0.0.1
  tags:
  - ${model._target_}
data:
  auto_resume: true
  checkpoint_path: null
  data_module:
    _recursive_: true
    _target_: gendyndiff.common.data.datamodule.CrystDataModule
    average_density: 0.05771451654022283
    batch_size:
      train: 1
      val: 1
    max_epochs: 2200
    num_workers:
      train: 4
      val: 4
    properties: []
    root_dir: datasets/SrTiO3
    train_dataset:
      _target_: gendyndiff.common.data.dump_dataset.DumpDataset.from_dump_file
      dump_file_path: ${oc.env:PROJECT_ROOT}/../datasets/SrTiO3/dump.NPT
    val_dataset:
      _target_: gendyndiff.common.data.dump_dataset.DumpDataset.from_dump_file
      dump_file_path: ${oc.env:PROJECT_ROOT}/../datasets/SrTiO3/dump.NPT
  lightning_module:
    _target_: gendyndiff.diffusion.lightning_module.DiffusionLightningModule
    diffusion_module:
      _target_: gendyndiff.diffusion.diffusion_module.DiffusionModule
      corruption:
        _target_: gendyndiff.diffusion.corruption.multi_corruption.MultiCorruption
        discrete_corruptions: {}
        sdes:
          pos:
            _target_: gendyndiff.common.diffusion.corruption.NumAtomsVarianceAdjustedWrappedVESDE
            limit_info_key: num_atoms
            sigma_max: 5.0
            wrapping_boundary: 1000000.0
      loss_fn:
        _target_: gendyndiff.common.loss.MaterialsLoss
        d3pm_hybrid_lambda: 0.01
        include_atomic_numbers: false
        include_cell: false
        include_pos: true
        reduce: sum
        weights:
          pos: 1.0
      model:
        _target_: denoiser.GemNetTDenoiser
        atom_type_diffusion: none
        denoise_atom_types: false
        gemnet:
          _target_: gendyndiff.common.gemnet.gemnet.GemNetT
          atom_embedding:
            _target_: gendyndiff.common.gemnet.layers.embedding_block.AtomEmbedding
            emb_size: 512
            with_mask_type: false
          cutoff: 5.0
          emb_size_atom: 512
          emb_size_edge: 512
          latent_dim: 512
          max_cell_images_per_dim: 5
          max_neighbors: 20
          num_blocks: 4
          num_targets: 1
          otf_graph: true
          regress_stress: false
          scale_file: /scratch/amlt_code/gendyndiff/common/gemnet/gemnet-dT.json
        hidden_dim: 512
        property_embeddings: {}
        property_embeddings_adapt: {}
      pre_corruption_fn:
        _target_: gendyndiff.property_embeddings.SetEmbeddingType
        dropout_fields_iid: false
        p_unconditional: 0.2
    optimizer_partial:
      _partial_: true
      _target_: torch.optim.Adam
      lr: 0.0001
    scheduler_partials:
    - frequency: 1
      interval: epoch
      monitor: loss_train
      scheduler:
        _partial_: true
        _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
        factor: 0.6
        min_lr: 1.0e-06
        patience: 50
        verbose: true
      strict: true
  load_original: false
  params: {}
  train: true
  trainer:
    _target_: pytorch_lightning.Trainer
    accelerator: gpu
    accumulate_grad_batches: 4
    log_every_n_steps: 10
    callbacks:
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
      log_momentum: false
      logging_interval: step
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      every_n_epochs: 1
      filename: '{epoch}-{loss_val:.2f}'
      mode: min
      monitor: loss_val
      save_last: true
      save_top_k: 1
      verbose: false
    - _target_: pytorch_lightning.callbacks.TQDMProgressBar
      refresh_rate: 50
    - _target_: gendyndiff.common.data.callback.SetPropertyScalers
    check_val_every_n_epoch: 5
    devices: 1
    gradient_clip_algorithm: value
    gradient_clip_val: 0.5
    logger:
      _target_: pytorch_lightning.loggers.CSVLogger
      save_dir: logs
    max_epochs: 2200
    num_nodes: 1
    precision: 16-mixed
